name: web-modelos
x-operational-logging: &operational-logging
  driver: json-file
  options:
    max-size: "1m"
    max-file: "3"
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clasificados}
      POSTGRES_USER: ${POSTGRES_USER:-clasificados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  objects:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    profiles: ["rights-objects"]
    environment:
      RUSTFS_ACCESS_KEY: ${RIGHTS_OBJECT_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RIGHTS_OBJECT_SECRET_KEY:-}
      RUSTFS_CONSOLE_ENABLE: "false"
    ports: ["127.0.0.1:${RIGHTS_OBJECT_PORT:-53900}:9000"]
    volumes: ["rights_object_data:/data"]
  app:
    logging: *operational-logging
    build: .
    env_file: .env
    environment:
      PUBLIC_ORIGIN: ${DOCKER_PUBLIC_ORIGIN:-http://localhost:18080}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["private_media:/app/media/private", "static_data:/app/staticfiles", "rights_delivery:/app/media/delivery"]
  worker:
    logging: *operational-logging
    build: .
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: .env
    environment:
      PUBLIC_ORIGIN: ${DOCKER_PUBLIC_ORIGIN:-http://localhost:18080}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["private_media:/app/media/private", "rights_delivery:/app/media/delivery"]
  beat:
    logging: *operational-logging
    build: .
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  caddy:
    image: caddy:2-alpine
    environment:
      RIGHTS_DELIVERY_PROXY_SECRET: ${RIGHTS_DELIVERY_PROXY_SECRET:-}
    ports: ["127.0.0.1:${HTTP_PORT:-18080}:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - rights_delivery:/srv/delivery:ro
    depends_on: [app]
volumes:
  postgres_data:
  redis_data:
  private_media:
  static_data:
  rights_object_data:
  rights_delivery:
