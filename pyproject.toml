[project]
name = "web-modelos"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.6,<5.7",
  "gunicorn>=23,<24",
  "Pillow>=11,<13",
  "django-storages[s3]>=1.14,<2",
  "argon2-cffi>=23,<26",
  "pyotp>=2.9,<3",
  "ImageHash>=4.3,<5",
  "cryptography>=50,<51",
  "opencv-python-headless>=4.12,<5",
  "orjson>=3.13.0",
  "blake3>=1.0.11",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "playwright>=1.50,<2",
    "ruff>=0.12,<1",
    "pip-audit>=2.9,<3",
    "pytest-xdist>=3.6,<4",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Frozen comparison fragments execute in vars(publication_state), not as modules.
# Their original bytes are archived in fuentes-antes-saneamiento-20261009.tar.gz.
"docs/evidencias/mod05-orden-reference0110.py" = ["F821"]
"docs/evidencias/mod05-sucios-reference0110.py" = ["F821"]
